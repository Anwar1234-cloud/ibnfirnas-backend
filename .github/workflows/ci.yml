name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ibnfirnas_test_db
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - run: ./mvnw -B test
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-key-not-real-must-be-at-least-256-bits-long
          MAIL_USERNAME: ci-test@example.com
          MAIL_PASSWORD: ci-test-password
          CLOUDINARY_CLOUD_NAME: ci-test-cloud
          CLOUDINARY_API_KEY: ci-test-key
          CLOUDINARY_API_SECRET: ci-test-secret