server:
  port: 8080

spring:
  application:
    name: ibnfirnas-backend

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/ibnfirnas_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # DevTools
  devtools:
    restart:
      enabled: true

# JWT Configuration
jwt:
  secret: ibnfirnas-super-secret-key-2024-must-be-at-least-256-bits-long
  expiration: 86400000

# Logging
logging:
  level:
    com.ibnfirnas: DEBUG
    org.springframework.security: DEBUG