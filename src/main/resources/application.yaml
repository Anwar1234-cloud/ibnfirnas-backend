spring:

  management:
    endpoints:
      web:
        exposure:
          include: health

  config:
    import: optional:file:.env[.properties]

  application:
    name: ibnfirnas-backend

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ibnfirnas_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Flyway — replaces ddl-auto:update as the schema-change mechanism.
  # baseline-on-migrate + baseline-version: 1 lets Flyway attach to an
  # existing database (like local dev, already at V1's schema) without
  # re-running V1's SQL — it just records V1 as already-applied and runs
  # anything after it. A genuinely fresh database (e.g. a new prod DB)
  # runs every migration from V1 onward for real.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  # DevTools
  devtools:
    restart:
      enabled: true

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true



  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS — comma-separated list of allowed frontend origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false
  default-produces-media-type: application/json

# Logging
logging:
  level:
    com.ibnfirnas: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN



# Cloudinary

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


# Google
google:
  client-id: ${GOOGLE_CLIENT_ID:282521229458-p7dk39mknn8dsc628bdc0q4qt6ba07bf.apps.googleusercontent.com}

# Admin bootstrap — optional, one-time. Set both to auto-provision the first
# ROLE_ADMIN account on startup. No-op if unset or if the account already
# exists. See AdminBootstrapRunner.
admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}